<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="theme-color" content="#C8102E">
  <meta name="description" content="Track Malaysian Nintendo eShop prices in ringgit: sales, price history and a wish list. Unofficial, not affiliated with Nintendo.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ringgit Radar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ringgit Radar</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Saved data handed over from the old address (backend/site/root/carry.html), merged once before the app
    // reads storage: the Wish Lists are combined, other settings are only filled in where none is set here.
    // Only accepted when the old address sent the visitor, so a link made elsewhere can't write into storage.
    (function () {
      var m = location.hash.match(/^#carry=(.*)$/);
      if (!m) return;
      history.replaceState(null, '', location.pathname + location.search);
      if (document.referrer.indexOf('https://ringgit-radar-mu.vercel.app/') !== 0) return;
      try {
        var d = JSON.parse(decodeURIComponent(m[1]));
        for (var k in d) {
          if (k.indexOf('flutter.') !== 0 || typeof d[k] !== 'string') continue;
          if (k === 'flutter.wishlist') {
            var mine = JSON.parse(localStorage.getItem(k) || '[]');
            JSON.parse(d[k]).forEach(function (id) { if (mine.indexOf(id) < 0) mine.push(id); });
            localStorage.setItem(k, JSON.stringify(mine));
          } else if (localStorage.getItem(k) === null) {
            localStorage.setItem(k, d[k]);
          }
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
